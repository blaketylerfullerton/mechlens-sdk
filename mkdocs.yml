site_name: MechLens SDK
site_description: Record comparable mechanistic-interpretability experiments from your existing Python code.
site_url: https://blaketylerfullerton.github.io/mechlens-sdk/
repo_url: https://github.com/blaketylerfullerton/mechlens-sdk
strict: true

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Recording comparable conditions: comparable-runs.md
  - What the checks mean: integrity-checks.md
  - API reference: reference.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # llms.txt indexes the pages for coding agents; llms-full.txt is every page as one Markdown file.
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        The MechLens SDK (`pip install mechlens`) records a baseline and an intervention run
        from existing Python experiment code and uploads them to MechLens Cloud, which checks
        that the runs are comparable and helps publish a finding. Record the same fields in
        both runs, use the same project and stable example IDs, and change only the intervention.
      sections:
        Getting started:
          - index.md: What the SDK does and how runs become a finding
          - quickstart.md: Install, authenticate, record a baseline and an intervention run
        Recording comparable runs:
          - comparable-runs.md: Which fields to record in both runs and why
          - integrity-checks.md: What Cloud's comparison checks verify, and what they do not
        Reference:
          - reference.md: start_run, Run, errors, and environment variables
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            merge_init_into_class: true
            filters: ["!^_"]
