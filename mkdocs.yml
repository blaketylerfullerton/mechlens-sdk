site_name: MechLens SDK
site_description: Record comparable mechanistic-interpretability experiments from your existing Python code.
strict: true

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Recording a comparable pair: comparable-runs.md
  - What the checks mean: integrity-checks.md
  - API reference: reference.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            merge_init_into_class: true
            filters: ["!^_"]
