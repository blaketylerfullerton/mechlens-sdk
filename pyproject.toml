[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mechlens"
dynamic = ["version"]
description = "Record and share mechanistic interpretability experiments"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MechLens" }]
requires-python = ">=3.10"
keywords = ["interpretability", "mechanistic-interpretability", "sae", "steering", "experiments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.urls]
Homepage = "https://mechlens-cloud-fgstc.ondigitalocean.app"
Documentation = "https://blaketylerfullerton.github.io/mechlens-sdk/"
Source = "https://github.com/blaketylerfullerton/mechlens-sdk"
Issues = "https://github.com/blaketylerfullerton/mechlens-sdk/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.7,<10", "mkdocstrings-python>=2,<3", "mkdocs-llmstxt>=0.5,<1", "ruff"]

[tool.setuptools.dynamic]
version = { attr = "mechlens._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechlens = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

